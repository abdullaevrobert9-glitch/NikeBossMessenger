name: Build NikeBoss APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    # 1. Генерируем новый ключ прямо на сервере GitHub
    - name: Generate Keystore
      run: |
        keytool -genkey -v -keystore app/nikeboss-release.jks \
        -keyalg RSA -keysize 2048 -validity 10000 \
        -alias nikeboss \
        -storepass 123456 -keypass 123456 \
        -dname "CN=NikeBoss, OU=NikeBoss, O=NikeBoss, L=Moscow, ST=Moscow, C=RU"
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    # 2. Собираем релиз с этим ключом
    - name: Build Release APK
      run: ./gradlew assembleRelease
      env:
        KEYSTORE_PASSWORD: "123456"
        KEY_ALIAS: "nikeboss"
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: NikeBoss-Release-APK
        path: app/build/outputs/apk/release/app-release.apk

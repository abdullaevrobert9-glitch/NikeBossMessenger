apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.nikeboss.messenger'
    compileSdk 33

    defaultConfig {
        applicationId "com.nikeboss.messenger"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            // Если собираем локально, берем ключ из папки проекта
            storeFile file("../nikeboss-release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "твой_пароль_от_ключа"
            keyAlias "nikeboss"
            keyPassword System.getenv("KEY_PASSWORD") ?: "твой_пароль_от_ключа"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false // Пока не усложняем, чтобы не сломать WebView
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.10.1'
}

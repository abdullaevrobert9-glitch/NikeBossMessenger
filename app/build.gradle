apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.nikeboss.messenger'
    compileSdk 33

    defaultConfig {
        applicationId "com.nikeboss.messenger"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
    release {
        storeFile file("nikeboss-release.jks")
        storePassword "123456"  // <--- ЗАМЕНИТЬ НА ЭТО
        keyAlias "nikeboss"
        keyPassword "123456"    // <--- ЗАМЕНИТЬ НА ЭТО
    }
}
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.10.1'
}
